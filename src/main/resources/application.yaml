server:
  port: 8080
  shutdown: graceful
  max-http-request-header-size: 8KB

spring:
  application:
    name: llm-rag-api
  r2dbc:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    pool:
      max-idle-time: 30m
      max-acquire-time: 30m
      initial-size: 0
      max-size: 1000
      max-life-time: 30m
      enabled: true
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false
  http:
    codecs:
      max-in-memory-size: 2MB
  ai:
    openai:
      api-key: ${OPEN_AI_KEY}
    anthropic:
      api-key: ${ANTHROPIC_KEY}
    cohere:
      # Cohere Rerank API 키. 비어 있으면 NoOpReranker 사용.
      api-key: ${COHERE_API_KEY:}
      rerank-model: ${COHERE_RERANK_MODEL:rerank-multilingual-v3.0}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      url: ${REDIS_URL}
      writer:
        host: ${REDIS_WRITER_HOST}
        port: ${REDIS_WRITER_PORT}
        username: default
        password: ${REDIS_WRITER_PASSWORD}
      reader:
        host: ${REDIS_READER_HOST}
        port: ${REDIS_READER_PORT}
        username: default
        password: ${REDIS_READER_PASSWORD}
      connect-timeout: 60
      command-timeout: 30
      password: ${REDIS_WRITER_PASSWORD}


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.springframework.r2dbc: DEBUG
    io.r2dbc.postgresql: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.web.reactive.function.client: DEBUG
    org.springframework.web.reactive.function.server: DEBUG
    org.springframework.web.cors: DEBUG
    reactor.netty.http: DEBUG
    reactor.netty.http.client: DEBUG
    io.lettuce.core: ERROR
    io.github.eschoe.llmragapi: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  cors:
    allowed-origins: ${ALLOW_ORIGINS:*}
    allowed-methods: ${ALLOW_METHODS:GET,POST,PUT,DELETE,OPTIONS,PATCH}
    allowed-headers: ${ALLOW_HEADERS:*}
    allowed-credentials: ${ALLOW_CREDENTIALS:true}
  llm:
    ctx-ttl-times: 15s
    resp-ttl-times: 6h
    hist-ttl-times: 48h
    hist-max: 50
    embedding-model: text-embedding-3-small
  document:
    chunk-size: 1000
    overlap-size: 100
  tesseract:
    # OCR 언어. tesseract 시스템 설치 후 PATH 에 등록되어 있어야 한다.
    # tessdata 위치는 환경변수 TESSDATA_PREFIX 로 지정 (없으면 tesseract 기본 경로 사용)
    language: ${TESSERACT_LANG:kor+eng}
  parsing:
    pdf:
      # PDF OCR 전략. Tesseract 미설치 환경에서는 NO_OCR 유지.
      # 설치 후 'AUTO' 또는 'OCR_AND_TEXT_EXTRACTION' 으로 바꾸면 이미지 PDF 도 텍스트화됨.
      ocr-strategy: ${PDF_OCR_STRATEGY:NO_OCR}
      # OCR 페이지 렌더링 DPI. 기본 200 (빠름·안전). 인식률 부족 시 300 으로.
      ocr-dpi: ${PDF_OCR_DPI:200}
      # Tesseract Page Segmentation Mode: 3=Auto(기본), 6=Single block, 11=Sparse text
      ocr-psm: ${PDF_OCR_PSM:3}
      # GPT-4o vision 폴백. true 시 image-only PDF 감지 시 OCR 대신 vision API 사용 (비용 발생).
      vision-fallback: ${PDF_VISION_FALLBACK:false}
      vision-model: ${PDF_VISION_MODEL:gpt-4o}
      vision-dpi: ${PDF_VISION_DPI:150}
      vision-max-pages: ${PDF_VISION_MAX_PAGES:50}
      vision-concurrency: ${PDF_VISION_CONCURRENCY:3}
      # 비용 보호 — 페이지 한도 초과 시 업로드 거부
      vision-cost-per-page-usd: ${PDF_VISION_COST:0.005}
      vision-daily-pages-per-session: ${PDF_VISION_DAILY_SESSION:100}
      vision-daily-pages-global: ${PDF_VISION_DAILY_GLOBAL:500}
  rate-limit:
    window-sec: 60
    limit: 60
